---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-engine
  namespace: cosmic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-engine
  template:
    metadata:
      labels:
        app: node-engine
    spec:
      containers:
      - name: node-engine
        image: cosmic/node-engine:latest
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: cosmic-secrets
              key: mongo-uri
        - name: PORT
          value: "5000"
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: node-engine
  namespace: cosmic
spec:
  selector:
    app: node-engine
  ports:
  - port: 5000
    targetPort: 5000
---
# Horizontal Pod Autoscaler for Node Engine
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: node-engine-hpa
  namespace: cosmic
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: node-engine
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
