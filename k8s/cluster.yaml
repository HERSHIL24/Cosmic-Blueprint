---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: cosmic
---
# Secrets (base64 encoded - replace with real values)
apiVersion: v1
kind: Secret
metadata:
  name: cosmic-secrets
  namespace: cosmic
type: Opaque
stringData:
  postgres-user: "admin"
  postgres-password: "adminpassword"
  mongo-user: "admin"
  mongo-password: "adminpassword"
  mongo-uri: "mongodb://admin:adminpassword@mongodb:27017/cosmic_reports?authSource=admin"
  django-secret-key: "your-super-secret-django-key-change-in-production"
---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: cosmic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cosmic
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
# Ingress Controller (routes external traffic)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cosmic-ingress
  namespace: cosmic
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  rules:
  - host: cosmic.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: django-api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
