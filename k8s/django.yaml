---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-api
  namespace: cosmic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-api
  template:
    metadata:
      labels:
        app: django-api
    spec:
      containers:
      - name: django-api
        image: cosmic/django-api:latest
        command: ["gunicorn", "cosmic_core.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4"]
        env:
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_NAME
          value: astrology_db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: cosmic-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cosmic-secrets
              key: postgres-password
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: NODE_SERVICE_URL
          value: http://node-engine:5000
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: cosmic-secrets
              key: django-secret-key
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: django-api
  namespace: cosmic
spec:
  selector:
    app: django-api
  ports:
  - port: 8000
    targetPort: 8000
